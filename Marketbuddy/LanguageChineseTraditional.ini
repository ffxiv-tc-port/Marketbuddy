Needs the TataruPraise plugin; without it this does nothing at all. It only sends a notification - no extra market query is sent and nothing about the survey changes. It speaks once, and only when this world's list was surveyed all the way to the end: stopping it yourself, standing down for a relist or a delist, giving up after the first item got no answer, or failing to build the list at all, all stay quiet.==需要另外裝「塔塔露誇獎」外掛；沒裝的話這一項完全不做任何事。它只送出通知——不會多送任何一次市場查詢，也不會改變巡檢的任何行為。只有這個世界的清單整份掃到最後才響一次：自己按停、讓路給重掛或下架、第一件一直沒有回應而放棄、清單根本建不起來，通通不響。
