Where delisted items go - this applies to every delist this plugin does: the automatic ones during relisting (the two settings above) and both manual buttons, "Delist this retainer" in the sell list and "Delist all retainers" in the retainer menu. Player inventory is the default because it is the only choice that merges stacks: identical items spread across several retainers only combine when they all land in the same container, and each retainer's inventory is separate from every other one's. Your bags are smaller than what nine retainers can list, so a full-inventory stop is normal - clear space and press the button again to carry on.==下架的道具要收到哪裡——本外掛的每一種下架都適用：重掛過程中的自動下架（上面那兩項設定），以及兩顆手動按鈕，也就是出售品視窗的「本僱員全下架」與僱員選單的「全僱員下架」。預設是玩家背包，因為那是唯一會讓堆疊合併的選項：散在好幾名僱員身上的同款道具，只有全部落到同一個容器才會併成一個堆疊，而每名僱員的背包都是各自獨立的。你的背包比九名僱員能掛的量還小，所以中途因為背包滿而停下來是正常的——清出空間後再按一次就會接著跑。
