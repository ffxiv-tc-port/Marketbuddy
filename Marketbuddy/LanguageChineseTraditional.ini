Takes the price the item most recently actually sold for anywhere on your data centre and rounds it down to the nearest 100 gil. The figure comes from the Universalis web API - the same source PriceInsight uses - so the game's own market board is never queried and no listing is looked up in game. Items with no sale on record keep their usual pricing (lowest listing minus your undercut); nothing is guessed. What each item would be relisted at is shown in the live listings panel before you press the button.==取這件道具在整個資料中心最近一次真的成交的價格，無條件捨去到百位。數字來自 Universalis 的網路 API（與 PriceInsight 同一個來源），所以完全不會去問遊戲自己的市場板，也不會在遊戲裡查任何一筆掛售。查不到成交紀錄的道具維持原本的定價方式（最低掛售價再降你設定的金額），不會用別的來源硬湊。每一件會掛多少，在按下按鈕之前就顯示在「即時掛單」面板上。
