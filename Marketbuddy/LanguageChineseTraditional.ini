[Marketbuddy] Multi-character relisting finished: ?? character(s) relisted, ?? skipped, ?? item(s) repriced in total.==[Marketbuddy] 多角色重掛全部完成：?? 個角色重掛完畢、?? 個角色跳過，總共重掛 ?? 件。
no summoning bell within reach==身邊沒有搆得到的傳喚鈴
