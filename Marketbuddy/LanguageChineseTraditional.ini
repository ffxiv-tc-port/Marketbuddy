Off by default. The per-item query lines and the request-gate trace are always written to the log either way - this only decides whether they show up at Information level or stay at Debug. Turn it on when someone asks you for a market-board log; leaving it on just makes the log noisier. Refusals, timeouts and market errors are reported regardless of this setting.==預設關閉。逐件查價與送出節流閘門的軌跡兩種情況下都會寫進記錄檔，這個開關只決定它們要以 Information 等級出現、還是留在 Debug。有人跟你要市場記錄時再打開；一直開著只會讓記錄檔更吵。查價被拒、逾時與市場錯誤不受這個開關影響，一律照常回報。
