Batch repricing writes prices straight into the retainer's market container without opening any game window - which is exactly why it is fast, but it also means the game's sell list never redraws and keeps showing the prices it had when you opened it (a just-listed item stays at 999,999,999 on screen even though the server already has the right price). This panel is drawn by the plugin and re-read every frame, so it is always current. It only reads: no game windows are touched and nothing is clicked for you.==批次改價是直接把價格寫進雇員的市場容器、完全不開任何遊戲視窗——這正是它快的原因，但也代表遊戲的出售品清單永遠不會重畫，畫面會一直停在你開窗當下的價格（剛上架的道具即使伺服器上已經是正確價格，畫面上仍會顯示 999,999,999）。這個面板由外掛自己畫、每一幀重新讀取，所以永遠是最新的。它只讀不寫：不會去動任何遊戲視窗，也不會替你點任何東西。
