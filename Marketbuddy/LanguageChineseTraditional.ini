Off by default. The shopping list is a plain text file you write yourself (shopping_list.txt in this plugin's config folder), one item per line. With this on, every world you scan also records what your shopping list costs there, how many are on sale and when it was looked up - so you know which world to travel to before you leave.\nIt never buys anything. Items you are already selling cost no extra query - the same lookup fills in both lists.==預設關閉。採購清單是一個你自己寫的純文字檔（本外掛設定資料夾裡的 shopping_list.txt），一行一件。打開之後，每掃一個世界就順便記下採購清單在那裡的價格、有幾個在賣、以及是幾點查的——出門前就知道該去哪一個世界。\n它不會買任何東西。你自己也在賣的那幾件不必多查一次，同一次查詢會同時填兩份清單。
