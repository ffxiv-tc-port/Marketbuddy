Needs AutoRetainer. Each time AutoRetainer has finished a character and is about to log out to the next one, it hands over and this plugin runs one all-retainer relist tour, then hands control straight back. You have to arm it by hand for each round: arming is never saved, so restarting the game or reloading the plugin always leaves it off, and it disarms itself as soon as every character in the round is done. Nothing walks your character anywhere - a character that is not standing within reach of a summoning bell is simply skipped.==需要 AutoRetainer。每當 AutoRetainer 處理完一個角色、準備登出換下一角之前，它會把控制權交過來，由本外掛跑一輪全僱員重掛巡迴，跑完立刻還回去。每一輪都要你自己按下武裝：武裝狀態不會存檔，所以重開遊戲或重載外掛一律回到關閉，而且整輪跑完就自己解除。不會替你移動角色——沒有站在傳喚鈴旁邊的角色會直接跳過。
