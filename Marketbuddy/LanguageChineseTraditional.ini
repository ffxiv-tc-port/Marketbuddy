One extra column: how many times that item has sold, and how many times it came off the board without selling - counted from your own sales records, so no web request and nothing asked of the game. It answers "is it even worth listing this again" while you are standing at the sell list. Where there is no basis for an answer - the recording is off, or Marketbuddy has never had that retainer's list open - the cell shows a grey question mark instead of a zero, because "we never watched" and "it never sold" lead to opposite decisions. Purely informational: nothing is ever delisted or repriced because of these numbers.==多一欄：這件道具賣掉過幾次、以及沒賣掉就從架上下來過幾次——數字來自你自己的銷售紀錄，不送任何網路請求，也不向遊戲查任何東西。它回答的是「站在出售品清單前面時，這件到底還值不值得再掛一次」。沒有依據可以回答的時候（記錄功能關著，或 Marketbuddy 從來沒開過那位僱員的清單），那一格會顯示灰色的問號而不是 0，因為「我們沒在看」與「它賣不掉」會導出相反的決定。純顯示：不會因為這些數字自動下架或自動改價。
