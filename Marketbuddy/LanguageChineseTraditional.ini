Off = try in order: the retainer sell list if it is open (that retainer only), otherwise AllaganTools (every retainer of the current character), and the log file as a last resort.\nOn (default) = read InventoryTools' inventories.csv directly, covering every character's retainers; the downside is that its freshness depends on when InventoryTools last wrote to disk.==關著＝依序試：僱員出售品視窗開著時只看眼前那一位僱員，否則問 AllaganTools（目前角色的全部僱員），再不行才讀記錄檔。\n開著（預設）＝直接讀 InventoryTools 的 inventories.csv，一次涵蓋所有角色的僱員；缺點是它的新鮮度取決於 InventoryTools 上次寫檔的時間。
