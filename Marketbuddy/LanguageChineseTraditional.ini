Buying one thing off the market board usually means clicking a lot of rows, and the game never tells you where you are up to. This panel keeps the running count and the running gil for the trip, and adds a small table showing what the cheapest few listings add up to, so "is this enough" and "what will this cost" are answered on screen instead of in your head. Type in how many you want and the row that gets you there is highlighted. It only reads: nothing is ever bought, clicked or queried for you.==在市場板上買一件東西，通常得一列一列點很多次，而遊戲從來不告訴你已經買到哪了。這塊面板會記住這一趟的累計件數與累計花費，另外列出「最便宜的前幾列加起來是幾件、多少錢」，讓「這樣夠不夠」與「這樣要花多少」出現在畫面上，而不是留在你的腦袋裡。填入想湊的件數，湊夠的那一列就會被標起來。它只讀不寫：不會替你買、替你點，也不會替你送出任何查詢。
