Approximate: it was already listed when Marketbuddy first looked, so the clock starts from when the plugin loaded (??), not from when you actually listed it.==暫定值：Marketbuddy 第一次看的時候它就已經在架上了，所以是從外掛載入的時間（??）起算，不是你實際掛上去的時間。
Four extra columns, purely informational: the cheapest listing on your own world, the cheapest anywhere on your data centre, what the item last actually sold for (with the date), and how long it has been sitting on the board. The first three come from the Universalis web API in the same request the relist pricing uses, so nothing is asked of the game's market board; where Universalis has nothing the cell shows a grey question mark - never a zero. The game never says when something was listed, so the age is counted from the moment Marketbuddy watched it go up; anything that was already listed before then is marked with a ~ and counted from when the plugin loaded. Nothing here triggers anything - an item sitting there for a month is never relisted or delisted for you.==多四欄，純粹是資訊：本世界最便宜的掛售、整個資料中心最便宜的掛售、最近一次真的成交的價格（含日期），以及它已經在架上放了多久。前三個與重掛定價用的是同一次 Universalis 查詢，所以完全不會去問遊戲自己的市場板；Universalis 沒有資料時那一格是灰色的問號，絕不會是 0。遊戲從來不會告訴我們一件東西是什麼時候掛上去的，所以年齡是從 Marketbuddy 親眼看著它出現那一刻起算；在那之前就已經掛著的會標上 ~ 並從外掛載入時間起算。這裡的數字不會觸發任何事——某件東西放了一個月，也不會有人替你重掛或下架。
