Takes every listing of this retainer off the market and back into the retainer's own inventory ("Delist destination" in the settings). Asks for confirmation first.==把這名僱員的所有掛單全部下架、收回這名僱員自己的背包（由設定「下架收回至」決定）。按下去會先要求確認。
Where delisted items go - this applies to every delist this plugin does: the automatic ones during relisting (the two settings above) and both manual buttons, "Delist this retainer" in the sell list and "Delist all retainers" in the retainer menu. Player inventory is the default because it is the only choice that merges stacks: identical items spread across several retainers only combine when they all land in the same container, and each retainer's inventory is separate from every other one's. Your bags are smaller than what nine retainers can list, so a full-inventory stop is normal - clear space and press the button again to carry on.==下架的道具要收到哪裡——本外掛的每一種下架都適用：重掛過程中的自動下架（上面那兩項設定），以及兩顆手動按鈕，也就是出售品視窗的「本僱員全下架」與僱員選單的「全僱員下架」。預設是玩家背包，因為那是唯一會讓堆疊合併的選項：散在好幾名僱員身上的同款道具，只有全部落到同一個容器才會併成一個堆疊，而每名僱員的背包都是各自獨立的。你的背包比九名僱員能掛的量還小，所以中途因為背包滿而停下來是正常的——清出空間後再按一次就會接著跑。
Only delist listings priced above==只下架單價高於
gil per item==gil（每件）的掛單
Listings at ?? gil per item or below stay on the market==單價 ?? gil（含）以下的掛單會留在市場上
Off - every listing gets delisted==停用中——所有掛單都會被下架
Listings priced at or below this stay on the market. The threshold is the price per item, not the price of the whole stack: a stack of 5 at 1,000 gil each counts as 1,000, not 5,000. Set it back to 0 in /mbuddy to delist everything again.==單價低於或等於這個值的掛單會留在市場上。門檻比的是每一件的價格，不是整堆的總價：一堆 5 件、每件 1,000 gil 的掛單算 1,000 而不是 5,000。在 /mbuddy 裡把它改回 0 就會恢復成全部下架。
The threshold is the price per item, the same number the sell list shows in its unit price column - not the price of the whole stack. It applies to both manual delist buttons ("Delist this retainer" and "Delist all retainers"). It deliberately does NOT touch the two automatic delists above, which exist to take cheap listings off the board: those two do the opposite job, so filtering them by "only the expensive ones" would just cancel them out. If a price cannot be read for some reason, that listing is left alone.==門檻比的是每一件的價格，也就是出售品清單「單價」欄看到的那個數字，不是整堆的總價。它對兩顆手動下架按鈕都有效（「本僱員全下架」與「全僱員下架」）。它刻意不影響上面那兩項自動下架——那兩項的用途是把賣太便宜的掛單撤下來，跟「只下架貴的」正好相反，套上去只會互相抵銷。若某一格的價格讀不出來，那一件會留著不動。
Ticked retainers are never visited by "Delist all retainers" - keep the ones you want selling high-value goods here. This only affects the delist tour: relisting still visits them, otherwise their prices would slowly go stale, and "Delist this retainer" still works when you are standing at that retainer, because that is an explicit instruction about that one retainer.==打勾的僱員永遠不會被「全僱員下架」拜訪——想讓它繼續賣高價品的僱員就勾在這裡。這只影響巡迴下架：重掛巡迴仍然會去拜訪它們，否則它們的價格會慢慢變成過時價；而你站在該僱員面前時，「本僱員全下架」也照樣有效，因為那是針對這一名僱員下的明確指令。
Open the retainer list once and your retainers appear here==開啟一次僱員選單，你的僱員就會出現在這裡
?? retainer(s) on the list - open the retainer list to see which==名單裡有 ?? 名僱員——開啟僱員選單才看得到是誰
(?? listed)==（掛單 ?? 件）
?? more on the list are not this character's retainers==名單裡另有 ?? 筆不是這名角色的僱員
The list stores retainer IDs rather than names, so it survives renames and works per character. Another character's retainer names cannot be looked up from here, but they are still skipped when you play that character.==名單存的是僱員 id 不是名字，所以改名不會讓它失效，也能跨角色各自記住。別的角色的僱員名字在這裡查不到，但你切換到那名角色時一樣會被跳過。
