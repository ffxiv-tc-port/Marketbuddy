Listings priced at or below this stay on the market. The threshold is the price per item, not the price of the whole stack: a stack of 5 at 1,000 gil each counts as 1,000, not 5,000. Set it back to 0 in /mbuddy to delist everything again.==單價低於或等於這個值的掛單會留在市場上。門檻比的是每一件的價格，不是整堆的總價：一堆 5 件、每件 1,000 gil 的掛單算 1,000 而不是 5,000。在 /mbuddy 裡把它改回 0 就會恢復成全部下架。
The threshold is the price per item, the same number the sell list shows in its unit price column - not the price of the whole stack. It applies to both manual delist buttons ("Delist this retainer" and "Delist all retainers"). It deliberately does NOT touch the two automatic delists above, which exist to take cheap listings off the board: those two do the opposite job, so filtering them by "only the expensive ones" would just cancel them out. If a price cannot be read for some reason, that listing is left alone.==門檻比的是每一件的價格，也就是出售品清單「單價」欄看到的那個數字，不是整堆的總價。它對兩顆手動下架按鈕都有效（「本僱員全下架」與「全僱員下架」）。它刻意不影響上面那兩項自動下架——那兩項的用途是把賣太便宜的掛單撤下來，跟「只下架貴的」正好相反，套上去只會互相抵銷。若某一格的價格讀不出來，那一件會留著不動。
Ticked retainers are never visited by "Delist all retainers" - keep the ones you want selling high-value goods here. This only affects the delist tour: relisting still visits them, otherwise their prices would slowly go stale, and "Delist this retainer" still works when you are standing at that retainer, because that is an explicit instruction about that one retainer.==打勾的僱員永遠不會被「全僱員下架」拜訪——想讓它繼續賣高價品的僱員就勾在這裡。這只影響巡迴下架：重掛巡迴仍然會去拜訪它們，否則它們的價格會慢慢變成過時價；而你站在該僱員面前時，「本僱員全下架」也照樣有效，因為那是針對這一名僱員下的明確指令。
