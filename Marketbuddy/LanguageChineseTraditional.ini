Take your own listings around the worlds and look up what each of them is going for, one item at a time, then compare. Nothing happens on its own: you press a button once per world, and travelling to the next world is a separate button. It only ever sends the same market query the game's own search sends - no price is changed, nothing is listed or delisted. Results are appended to price_survey.csv in this plugin's config folder.==帶著自己掛售中的清單一個世界一個世界走，逐件查那件東西在當地賣多少，最後放在一起比。它不會自己動：一個世界按一次按鈕，要去下一個世界是另一顆按鈕。送出去的就是遊戲自己搜尋市場時送的那一個查詢，不改任何價格、不掛售也不下架。結果會追加寫進本外掛設定資料夾裡的 price_survey.csv。
