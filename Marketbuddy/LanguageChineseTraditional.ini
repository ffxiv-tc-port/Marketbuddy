seconds (0 = always ask the server)==秒內看到的市場資料（0 = 每次都重新向伺服器查）
Market board answers are delivered to every plugin at once, so anything you (or another plugin) looked up recently is already here and can be reused without asking the server again - that is the single biggest speed-up available without touching the game. Nothing is ever triggered by receiving data; it is only remembered. Listings belong to a world, not to a character, so the cache now survives character switches and is only dropped when you change world - raise this if you work through several characters in one sitting. It never stores "nobody is selling this" unless this plugin confirmed it itself.==市場板的查詢結果會同時送給每一個外掛，所以你自己（或其他外掛）剛查過的道具其實早就在這裡了，可以直接拿來用、不必再問伺服器一次——這是不去動遊戲本體的前提下最大的一項提速。收到資料**不會**觸發任何動作，只會被記下來。掛售資料屬於「世界」而不屬於「角色」，所以換角色時快取會**保留**下來，只有換伺服器才會整份丟掉——如果你習慣一次跑完好幾個角色，可以把這個秒數調大（例如 1800＝30 分）。而且除非本外掛自己確認過，否則絕不會把「沒人在賣」記進快取。
