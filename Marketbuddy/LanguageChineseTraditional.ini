[Marketbuddy] Nothing above ?? gil per unit here - ?? listing(s) left alone.==[Marketbuddy] 這名僱員沒有單價高於 ?? gil 的掛單——?? 件全部留著不動。
[Marketbuddy] ?? listing(s) kept: unit price not above ?? gil.==[Marketbuddy] 保留 ?? 件掛單：單價未高於 ?? gil。
[Marketbuddy] ?? listing(s) kept across the tour: unit price not above ?? gil.==[Marketbuddy] 整趟巡迴共保留 ?? 件掛單：單價未高於 ?? gil。
Retainers the delist tour leaves alone: none==巡迴下架時要跳過的僱員：無
Retainers the delist tour leaves alone: ?? skipped==巡迴下架時要跳過的僱員：已跳過 ?? 名
?? (No.??)==??（第 ?? 號）
Ask TataruPraise to say a line when relisting finishes==重掛跑完時請「塔塔露誇獎」念一句
Needs the TataruPraise plugin; without it this does nothing at all. It only sends a notification - nothing is triggered, nothing about relisting changes. It speaks once per finished run: once when the all-retainer relist tour ends, and once when a single retainer's relist ends on its own. Each retainer inside a tour stays quiet, and so does the automatic pricing of a just quick-listed item.==需要另外裝「塔塔露誇獎」外掛；沒裝的話這一項完全不做任何事。它只送出通知——不會觸發任何動作，也不會改變重掛的任何行為。整輪跑完才響一次：全僱員重掛巡迴結束時響一次，單獨跑某一個僱員的重掛結束時也響一次。巡迴途中的每個僱員都不響，剛快速上架的那一件自動定價也不響。
